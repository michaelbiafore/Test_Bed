name: golden-drift-check

# Weekly re-run of golden + regression to catch silent drift (PLAN_ZZ_Upgrade_01.md, item R3).
# Opens a GitHub issue on failure so drift surfaces without a human remembering to re-run.
# Placeholder runner until Phase 3, same as golden-gate.

on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests (generator)
        run: node --test

      # TODO(phase-3): replace with the real golden + regression runner.
      - name: Golden + regression (placeholder until Phase 3)
        run: echo "placeholder — Phase 3 wires the real golden/regression runner"

      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Golden drift detected on weekly check';
            const body = [
              'The scheduled `golden-drift-check` run failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Each drift should become a new golden case, risk rule, or context entry',
              '(see PROMOTION_LOG.md and SE_Discipline.md Step 5).',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'golden-drift',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['golden-drift'],
              });
            }
